name: VUPIO preview installers
on:
  push:
    branches: [main]
    paths: ['mimic/__init__.py']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both verified installers as a GitHub prerelease
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install innosetup --yes --no-progress
      - name: Verify audio mixer logic
        run: python -m unittest discover -s tests -p test_windows_audio.py
      - name: Verify network safety and VPN DNS fallback
        run: python -m unittest discover -s tests -p test_public_audio.py
      - name: Verify Radar failure states
        run: python -m unittest discover -s tests -p test_radar_client.py
      - name: Build Windows installer
        run: ./scripts/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VUPIO-Windows-x64-preview
          path: build/releases/VUPIO-Windows-x64-Setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build dependencies
        run: |
          brew install ffmpeg cmake
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Verify app and DSP
        run: .venv/bin/python -m unittest discover -s tests
      - name: Build Mac installer with driver and local models
        run: |
          set -o pipefail
          MIMIC_BUNDLE_MODELS=1 ./scripts/package.sh | tee build-vupio.log
          stage=$(sed -n 's/^Signature verified at //p' build-vupio.log | tail -1)
          test -d "$stage"
          MIMIC_APP_BUNDLE="$stage" ./scripts/package_installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VUPIO-macOS-AppleSilicon-preview
          path: build/releases/VUPIO-macOS-AppleSilicon.pkg
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: VUPIO-*-preview
          path: release
          merge-multiple: true
      - name: Publish the tested Mac and Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build=$(python3 -c 'from mimic import BUILD; print(BUILD)')
          tag="alpha-$build"
          cd release
          sha256sum VUPIO-macOS-AppleSilicon.pkg VUPIO-Windows-x64-Setup.exe > SHA256SUMS.txt
          cat > /tmp/vupio-release-notes <<'EOF'
          - Recover audio downloads and Trend Radar feeds from VPN Fake-IP DNS, including standard IPv6 and mixed IPv4/IPv6 answers.
          - Open the entire audio file available from a source using Edit full audio in Discover.
          - Trim quiet edges in Studio while preserving pauses inside the recording.
          - Verify public DNS over TLS and pin the validated public server IP; private networks remain blocked.
          - Apply the same network path to meme downloads, catalog audio and Trend Radar feeds.
          - Show actionable Radar errors instead of silently checking thirty failed downloads.
          - Replace unavailable sounds; stop repeated requests when a source rate-limits or denies downloads.
          - Retain local clip listening and its saved output from build 4046.

          Preview installers for macOS 26+ (Apple Silicon) and Windows 11 x64. The Mac app is ad-hoc signed, with no Apple notarization. The Windows installer has no Authenticode signature. Checksums are in SHA256SUMS.txt. Download and run the installer linked from Updates.
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease \
            --title "VUPIO Alpha · build $build" --notes-file /tmp/vupio-release-notes \
            VUPIO-macOS-AppleSilicon.pkg VUPIO-Windows-x64-Setup.exe SHA256SUMS.txt
          gh release edit "$tag" --draft=false
