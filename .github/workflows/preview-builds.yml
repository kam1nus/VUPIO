name: VUPIO preview installers
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both verified installers as a GitHub prerelease
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install innosetup --yes --no-progress
      - name: Verify audio mixer logic
        run: python -m unittest discover -s tests -p test_windows_audio.py
      - name: Build Windows installer
        run: ./scripts/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VUPIO-Windows-x64-preview
          path: build/releases/VUPIO-Windows-x64-Setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build dependencies
        run: |
          brew install ffmpeg cmake
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Verify app and DSP
        run: .venv/bin/python -m unittest discover -s tests
      - name: Build Mac installer with driver and local models
        run: |
          set -o pipefail
          MIMIC_BUNDLE_MODELS=1 ./scripts/package.sh | tee build-vupio.log
          stage=$(sed -n 's/^Подпись проверена в //p' build-vupio.log | tail -1)
          test -d "$stage"
          MIMIC_APP_BUNDLE="$stage" ./scripts/package_installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VUPIO-macOS-AppleSilicon-preview
          path: build/releases/VUPIO-macOS-AppleSilicon.pkg
          if-no-files-found: error

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: VUPIO-*-preview
          path: release
          merge-multiple: true
      - name: Publish the tested Mac and Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build=$(python3 -c 'from mimic import BUILD; print(BUILD)')
          tag="alpha-$build"
          cd release
          sha256sum VUPIO-macOS-AppleSilicon.pkg VUPIO-Windows-x64-Setup.exe > SHA256SUMS.txt
          cat > /tmp/vupio-release-notes <<'EOF'
          - Trend Radar и региональные подборки для Mac и Windows.
          - Предзагрузка, замена недоступных мем-звуков и добавление одним нажатием.
          - Раздел «Обновления» с проверкой релизов GitHub для текущей платформы.

          Это тестовые установщики для macOS 26+ (Apple Silicon) и Windows 11 x64. Пакет macOS содержит подпись для локального тестирования, без нотарификации Apple. Установщик Windows не подписан Authenticode. Контрольные суммы доступны в SHA256SUMS.txt. Нужная сборка скачивается отдельным установщиком из раздела «Обновления».
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease \
            --title "VUPIO Alpha · сборка $build" --notes-file /tmp/vupio-release-notes \
            VUPIO-macOS-AppleSilicon.pkg VUPIO-Windows-x64-Setup.exe SHA256SUMS.txt
          gh release edit "$tag" --draft=false
