name: VUPIO preview installers
on:
  push:
    branches: [main]
    paths: ['mimic/__init__.py']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both verified installers as a GitHub prerelease
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install innosetup --yes --no-progress
      - name: Verify audio mixer logic
        run: python -m unittest discover -s tests -p test_windows_audio.py
      - name: Verify network safety and VPN DNS fallback
        run: python -m unittest discover -s tests -p test_public_audio.py
      - name: Verify Radar failure states
        run: python -m unittest discover -s tests -p test_radar_client.py
      - name: Verify web search and credit tracking
        run: python -m unittest discover -s tests -p test_web_agent.py
      - name: Verify GitHub update download and installer selection
        run: python -m unittest discover -s tests -p test_updates.py
      - name: Verify persistent soundboards
        run: python -m unittest discover -s tests -p test_boards.py
      - name: Verify Pro collections and review-before-import
        run: python -m unittest discover -s tests -p test_pro.py
      - name: Verify account security and Windows credential storage
        run: python -m unittest discover -s tests -p test_account.py
      - name: Build Windows installer
        run: ./scripts/package_windows.ps1
      - name: Verify the Windows installer upgrades without writing the models
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'VUPIO upgrade test'
          $flags = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('"/DIR={0}"' -f $destination))
          $full = Get-Item build/releases/VUPIO-Windows-x64-Setup.exe
          $patch = Get-Item build/releases/VUPIO-Windows-x64-Update-*.exe
          $process = Start-Process $full.FullName -ArgumentList $flags -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Full setup failed ($($process.ExitCode))" }
          $buildFile = Join-Path $destination 'installed-build.txt'
          $build = [int](Get-Content $buildFile)
          $manifest = Join-Path $destination 'Models/components.json'
          $before = Get-FileHash $manifest
          Set-Content $buildFile ($build - 1) -Encoding ascii -NoNewline
          $process = Start-Process $patch.FullName -ArgumentList $flags -PassThru
          $process.WaitForExit()
          $process.Refresh()
          if ($process.ExitCode -ne 0 -or [int](Get-Content $buildFile) -ne $build) { throw "Updater setup failed ($($process.ExitCode))" }
          if ((Get-FileHash $manifest).Hash -ne $before.Hash) { throw 'The installer changed the bundled models' }
          Start-Sleep -Seconds 2
          $relaunched = Get-Process VUPIO -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq (Join-Path $destination 'VUPIO.exe') }
          if (!$relaunched) { throw 'The silent updater did not relaunch VUPIO' }
          $relaunched | Stop-Process -Force
          $process = Start-Process (Join-Path $destination 'VUPIO.exe') -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Updated app failed ($($process.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: VUPIO-Windows-x64-preview
          path: |
            build/releases/VUPIO-Windows-x64-Setup.exe
            build/releases/VUPIO-Windows-x64-Update-*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build dependencies
        run: |
          brew install ffmpeg cmake
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Verify app and DSP
        run: .venv/bin/python -m unittest discover -s tests
      - name: Build Mac installer with driver and local models
        env:
          VUPIO_SPARKLE_PRIVATE_KEY: ${{ secrets.VUPIO_SPARKLE_PRIVATE_KEY }}
        run: |
          set -o pipefail
          MIMIC_BUNDLE_MODELS=1 ./scripts/package.sh | tee build-vupio.log
          stage=$(sed -n 's/^Signature verified at //p' build-vupio.log | tail -1)
          test -d "$stage"
          build=$(.venv/bin/python -c 'from mimic import BUILD; print(BUILD)')
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$stage/Contents/Info.plist")" = "$build"
          MIMIC_APP_BUNDLE="$stage" ./scripts/package_installer.sh
          ./scripts/package_mac_update.sh "$stage"
          .venv/bin/python tests/mac_update_smoke.py "$build" "$stage" build/releases/VUPIO-macOS-AppleSilicon-Update-*.zip
          test -n "$VUPIO_SPARKLE_PRIVATE_KEY"
          signature=$(printf '%s' "$VUPIO_SPARKLE_PRIVATE_KEY" | build/dependencies/sparkle/bin/sign_update --ed-key-file - -p build/releases/VUPIO-macOS-AppleSilicon-Sparkle.zip)
          models_hash=$(shasum -a 256 "$stage/Contents/Resources/Models/components.json" | cut -d ' ' -f 1)
          .venv/bin/python scripts/write_sparkle_feed.py "$build" build/releases/VUPIO-macOS-AppleSilicon-Sparkle.zip "$signature" "$models_hash" > build/releases/vupio-macos-appcast.xml
          printf '%s' "$VUPIO_SPARKLE_PRIVATE_KEY" | build/dependencies/sparkle/bin/sign_update --ed-key-file - build/releases/vupio-macos-appcast.xml
          printf '%s' "$VUPIO_SPARKLE_PRIVATE_KEY" | build/dependencies/sparkle/bin/sign_update --ed-key-file - --verify build/releases/vupio-macos-appcast.xml
          .venv/bin/python tests/mac_sparkle_smoke.py -
          .venv/bin/python tests/mac_sparkle_smoke.py - --tamper
      - uses: actions/upload-artifact@v4
        with:
          name: VUPIO-macOS-AppleSilicon-preview
          path: |
            build/releases/VUPIO-macOS-AppleSilicon.pkg
            build/releases/VUPIO-macOS-AppleSilicon-Update-*.zip
            build/releases/VUPIO-macOS-AppleSilicon-Sparkle.zip
            build/releases/vupio-macos-appcast.xml
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    concurrency:
      group: vupio-public-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: VUPIO-*-preview
          path: release
          merge-multiple: true
      - name: Publish the tested Mac and Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build=$(python3 -c 'from mimic import BUILD; print(BUILD)')
          tag="alpha-$build"
          cd release
          mac=(VUPIO-macOS-AppleSilicon-Update-*.zip)
          win=(VUPIO-Windows-x64-Update-*.exe)
          test "${#mac[@]}" = 1 && test -f "${mac[0]}"
          test "${#win[@]}" = 1 && test -f "${win[0]}"
          assets=(VUPIO-macOS-AppleSilicon.pkg VUPIO-Windows-x64-Setup.exe "${mac[0]}" "${win[0]}" VUPIO-macOS-AppleSilicon-Sparkle.zip vupio-macos-appcast.xml)
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          cat > /tmp/vupio-release-notes <<'EOF'
          - Trend Radar Pro follows saved personal topics with local preferences and new-to-feed badges.
          - AI Collections plans searches, prepares actual previews and creates a soundboard after review.
          - Activate limited-use promo codes or complimentary tester/developer Pro granted by the owner.
          - Existing free soundboard, discovery, Studio, remote and audio routing remain available without an account.
          - Local AI falls back to source metadata when unavailable. Source restrictions and search quotas still apply.
          - Shared boards, Sound Drops, billing and Autopilot are not included in this Alpha.
          - Compatible in-app updates reuse the installed driver and models. First installs use the full package.
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease \
            --title "VUPIO Alpha · build $build" --notes-file /tmp/vupio-release-notes \
            "${assets[@]}" SHA256SUMS.txt
          gh release edit "$tag" --draft=false
          python3 ../scripts/write_update_feed.py "$tag" "${assets[@]}" > /tmp/vupio-updates.json
          endpoint="repos/$GITHUB_REPOSITORY/contents/vupio-updates.json"
          current=$(gh api "$endpoint?ref=update-feed")
          current_build=$(jq -r '.content' <<< "$current" | base64 -d | jq -er '.[0].tag_name | sub("^alpha-"; "") | tonumber')
          if (( build > current_build )); then
            appcast_endpoint="repos/$GITHUB_REPOSITORY/contents/vupio-macos-appcast.xml"
            appcast_sha=$(gh api "$appcast_endpoint?ref=update-feed" --jq .sha 2>/dev/null || true)
            appcast_args=()
            if [[ -n "$appcast_sha" ]]; then appcast_args=(-f "sha=$appcast_sha"); fi
            gh api --method PUT "$appcast_endpoint" -f branch=update-feed -f message="Sign Mac appcast for $tag" \
              "${appcast_args[@]}" -f content="$(base64 -w0 vupio-macos-appcast.xml)" --silent
            gh api --method PUT "$endpoint" -f branch=update-feed -f message="Point VUPIO updates to $tag" \
              -f sha="$(jq -er .sha <<< "$current")" -f content="$(base64 -w0 /tmp/vupio-updates.json)" --silent
          fi
      - name: Link the public installers from the main README
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/link_readme_release.py "$(python3 -c 'from mimic import BUILD; print(BUILD)')"
